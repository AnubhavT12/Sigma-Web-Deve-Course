<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editing Lists in Css</title>
    <style>
        nav ul li{
            list-style: devanagari;
            list-style-position: inside;
            background-color: aqua;
            border: 4px solid chartreuse;
            list-style-type:"😎";
            list-style-image: url("ss1.png");

        li{
            list-style-image: 😂;
        }
    </style>
</head>
<body>
    <nav>
        <ul class="lstyle">
            <li>home</li>
            <li>contacts</li>
            <li>messages</li>
            <li>notes</li>
        </ul>
    </nav>
            
</body>
</html>
