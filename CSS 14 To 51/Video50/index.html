<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        img{
            height: 200px;
            width: 200px;
        }


        .img1{
            filter: blur(2px);
        }

        .img2{
            filter: brightness(200%);
        }

        .img3{
            filter: grayscale(50%);
        }
    </style>
</head>
<body>

    <div>
        <img src="ss1.png" alt="" class="img1">
        <img src="ss1.png" alt="" class="img2">
        <img src="ss1.png" alt="" class="img3">
    </div>
    
</body>
</html>
