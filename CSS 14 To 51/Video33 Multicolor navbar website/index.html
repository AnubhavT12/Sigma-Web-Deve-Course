<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making a navigation bar in html css</title>
    <style>
        :root{
            --mcolor: yellow;
        }


        :root{
            --pricolor: red;
            }

        :root{
            --seccolor: blue;
            }

        :root{
            --tercolor: green;
            }


        nav{
            color: black;
        }

        .li1{
            color:var(--pricolor);
        }

        .li2{
            color:var(--seccolor);
        }

        .li3{
            color:var(--tercolor);
        }


        body{
            background-color: rgb(101, 205, 205);
        }


    </style>
</head>
<body>
    <pre>to make a navigation bar using variables
         that changes color contrast</pre>
    <nav>
        <ul>
            <li class="li1"><a href="https://www.youtube.com/">Youtube</a></li>
            <li class="li2"><a href="https://www.google.com/">Google</a></li>
            <li class="li3"><a href="https://www.youtube.com/watch?v=tVzUXW6siu0&list=PLu0W_9lII9agq5TrH9XLIKQvv0iaF2X3w&index=2">SigmaWebDev</a></li>
    </nav>
</body>
</html>
