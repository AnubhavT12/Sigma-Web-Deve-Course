<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Excercise In CSS</title>
    <style>
        h3{
            text-align: center;
            text-decoration: underline wavy;
            color: palevioletred;
        }

        .maindiv{
            /* background-color: rgb(219, 212, 212); */
            padding: 20px;
            margin: 20px;
            border: 2px solid grey;
            height: 500px;
            width: 400px;
        }

        .box{
            border: 2px solid grey;
        }

        .div1{
            height: fit-content;
            width: fit-content;
        }

        .div2{
            display: inline;
            background-color: aquamarine;

        }

        .div3{
            display: inline;
            background-color: aquamarine;
        }

        .div4{
            text-align: center;
            font-size: 25px;
            position: relative;
            top: 10px;
        }

        .div5{
            position: relative;
            top: 20px;
            left: 2px;
            font-size: 45px;
        }

        .div6{
            position: relative;
            top: 40px;
            left: 150px;
            display: inline-block;
        }




    </style>

</head>
<body>
    <h3>Basic Card For A Birthday</h3>


    <div class="maindiv">

     <div class=" box div1"><img src="cake.jpg" alt="cake image here"></div>
     <div class=" box div2">Nature</div>
     <div class=" box div3">Lake</div>

     <div class=" box div4">You Are Invited To Birthday Party!!</div>
     
     <div class=" box div5">Celebrate Our Sons Birthday At Hotel Silver Shine at 5pm
     </div>
     
     <div class=" box div6">More Details</div>

    </div>
    
</body>
</html>
