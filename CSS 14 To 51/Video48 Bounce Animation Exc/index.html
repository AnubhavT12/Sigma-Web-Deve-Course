<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Animation Using Html Css Only</title>
    <style>
        .cont{
            background-color: aquamarine;
            height: 80vh;
            width: 90vw;
            align-content: flex-end;
        }
        

        .box{
            background-color: red;
            height: 80px;
            width: 80px;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;

            /* animation: name duration timing-function delay iteration-count direction fill-mode; */

            animation: bx 5s 50ms infinite,
                       by 5s 50ms infinite;
        }

        @keyframes bx {
            from{

            }

            to{
                transform: translateX(600px);
            }
        }

        @keyframes by {
            from{

            }

            to{
                transform: translateY(-60px);
            }
        }

    </style>
</head>
<body>
<div class="cont">
    <div class="box">ball</div>
</div>
    
</body>
</html>
