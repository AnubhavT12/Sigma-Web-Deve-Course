<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding margin and border in css</title>
    <style>
        *{background-color: rgba(239, 158, 158, 0.847);}

        .box{color: chartreuse;background-color: blanchedalmond;}
        
        .box1{color: cadetblue;
            padding: 10px;
            margin: 5px;
            border: 30px;}

        .box2{color: blue;
            padding: 30px;
            margin: 15px; 
            border: 90px;}

    </style>
</head>
<body>
    <p class="box box1">this is the first paragraph</p>
    <p class="box box2">this is the second paragraph</p>
    <p class="box box3">this is the third paragraph</p>
    
    <div class="box box1">this the first div</div>
    <div class="box box2">this the second div</div>
    <div class="box box3">this the third div</div>
</body>
</html>
