<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning in Html and css</title>
    <style>
        
        *{
            margin: 0;
            padding: 0;
        }

        .parent{
            padding: 10px;
            margin: 10px;
            border: 2px solid red;
            position: fixed;
            z-index: 0;
        }

        .box{
            height: 130px;
            width: 80vw;
            border: 2px solid ;
            margin: 5px;
        }

        .box1{
            background-color: aqua;
            position: relative;
            top: 10px;
            left: 10px;
            z-index: 0;
        }

        .box2{
            background-color: aquamarine;
            position: relative;
            top: 20px;
            left: 20px;
            z-index: 1;

        }

        .box3{
            background-color: azure;
            position: absolute;
            top: 45px;
            left: 45px;
            z-index: 2;
            /* the 3 box will be positioned to
            nearest positioned parent elemennt here it is 
            parent box with red outline */

        }
        .box4{
            background-color: rgb(242, 178, 82);
            position: sticky;
            top: 60px;
            left: 60px;
            z-index: 3;
        }


    </style>
    </head>
    <body>
        <div class="parent">
            <div class="box box1">FIRST BOX</div>
            <div class="box box2">SECOND BOX</div>
            <div class="box box3">THIRD BOX</div>
            <div class="box box4">FOURTH BOX</div>
        </div>
    </body>
</html>
