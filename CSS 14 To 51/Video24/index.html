<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows And Outline In Css</title>
    <style>
        div{color: red;}
        .boxshad{
            box-shadow: 5px 15px 5px red;
            border: 10px;
            padding: 20px;
        }

        .textshad{
            text-shadow: 5px 15px greenyellow;
        }

        .outline{
            outline: 10px;
        }
    </style>
</head>
<body>the shadows in css can be applied in box and text
    the syntax is 
    <div class="boxshad">this is a div content box</div>
    <p class="textshad">this is a paragraph content type of thing</p>
    <pre class="outline">this is the pre type content here it is thanks</pre>
</body>
</html>
