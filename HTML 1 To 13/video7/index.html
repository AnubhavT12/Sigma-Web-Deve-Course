<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Wensite For Form</title>
</head>
<body>
    <h1>build your one piece character</h1>
   
    <form action="post">
        <div>
            <label for="username">character name</label>
            <input type="text" name="username" placeholder="enter your name" id="username">
        </div>

        <div>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
        </div>

        <div>
            <input type="checkbox" id=" name" name="">
        </div>

    </form>
    
</body>
</html>
