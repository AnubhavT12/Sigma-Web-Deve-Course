<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id class query selector</title>
    <style>

        .box{
            height: 100px;
            width: 130px;
            background-color: bisque;
            color: aqua;
            padding: 10px;
            margin: 10px;
            border: 2px solid black;
        }

    </style>

</head>

<body>
    <div class="container">
        <div class="box">Hello this is hte div no. 1</div>
        <div class="box">Hello this is hte div no. 2</div>
        <div class="box">Hello this is hte div no. 3</div>
        <div class="box" id="box3.5">Hello this is hte div no. 3_5</div>
        <div class="box">Hello this is hte div no. 4</div>
        <div class="box" id="box4.5">Hello this is hte div no. 4_5</div>
        <div class="box">Hello this is hte div no. 5</div>
    </div>

    <script src="script.js">

    </script>

</body>
</html>
