<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Dynamic website builder</title>
    <style>
        .card{
            display: flex;
            border: 2px solid black;
            width: 900px;
            justify-content: center;
            align-items:center;
            padding: 12px;
            margin: 10px
                }

        .image img{
            width: 300px;
            height: 200px;
        }

        .text h1 , p{
            padding: 10px;
        }

        .image{
            position: relative;
        }

        .capsule{
                position: absolute;
                bottom: 0;
                right: 0;
                padding: 2px;
                color: white;
                background-color: black;
                opacity: 0.65;
                z-index: 10;
                border-radius: 5px;
                font-size: 17px;
        }

    </style>
</head>
<body>

<div class="container">

        <div class="card">

            <div class="image">
                <img src="ss1.png" alt="">
                <div class="capsule">13:06</div>
            </div>

            <div class="text">
                <h1>Introduction to backend | sigma development course</h1>
                <p>CodeWithHarry . 512k views . 2 Months Ago </p>
            </div>

        </div>

    </div> 
    
    <!-- //this is the card tmeplate -->

    <script src="script.js"></script>
</body>
</html>
