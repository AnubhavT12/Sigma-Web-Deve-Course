<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giving Random Coloor To boxes using DOM</title>

    <style>
        .container{
            border: 2px solid black;
             justify-content: center;
             align-items: center;
             display: flex;
        }

        .box{
            padding: 10px;
            margin: 10px;
            height: 45px;
            width: 55px;
            border: 2px solid rgb(63, 61, 61);
            justify-content: center;
            align-items: center;
            display: flex;
        }

    </style>

</head>

<body>
    <div class="container">
        <div class="box" id="box1">this is box 1</div>
        <div class="box" id="box2">this is box 2</div>
        <div class="box" id="box3">this is box 3</div>
        <div class="box" id="box4">this is box 4</div>
        <div class="box" id="box5">this is box 5</div>
    </div>
    
</body>

</html>
